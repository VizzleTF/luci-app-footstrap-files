# Everything that can be checked without a router.
#
# What is NOT here, and deliberately: installing the built packages on a real 25.12 and a real 24.10
# userland and driving the page against them. That claim needs a router, is made by hand before
# every release, and is written down in CLAUDE.md under "Verifying".

name: check

on:
  push:
    branches: [ main ]
  pull_request:
  # release.yml runs these same gates before a tag may publish, and a reusable workflow must say so
  # itself: without this trigger the release run fails at startup, in zero seconds, with "this run
  # likely failed because of a workflow file issue" and no job log to read.
  workflow_call:

permissions:
  contents: read

jobs:
  modules:
    name: parse, and parse again after jsmin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # tools/t0.sh fetches jsmin.c at the commit in luci-upstream.pin and verifies its sha256
      # before compiling it: the minifier that runs on the OpenWrt buildbot is the one that decides
      # whether a module still parses after a build, so the gate runs the real thing rather than a
      # grep for the shapes somebody thought of.
      - run: tools/t0.sh

  i18n:
    name: the catalogue is current and complete
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      # An uncompiled _() falls through to its English msgid and renders in English with nothing
      # reporting it, so a stale catalogue cannot fail loudly at runtime. It fails here instead.
      - run: ./update-po.sh --check
        working-directory: luci-app-footstrap-files

      # A catalogue is ITS OWN PACKAGE, for every language and not only for the one that exists
      # today. Nothing fails when a language is half-wired: `po/de/` would appear, stage.sh would
      # write dist/i18n-de, owfeed's hand-written package list would package neither, and German
      # would simply never reach a router with the build still green.
      - run: tools/i18n-packages.sh

  package:
    name: the package's load-bearing lines
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # csstidy, which luci.mk runs by default, is fifteen years older than the syntax this sheet
      # uses (color-mix(), :has()) and drops what it cannot parse while exiting 0. The owfeed path
      # minifies the sheet with tools/minify-css.sh instead, which is string-aware and checks its
      # own rule count.
      - name: LUCI_MINIFY_CSS:=0
        run: grep -qF 'LUCI_MINIFY_CSS:=0' luci-app-footstrap-files/Makefile

      # include/scan.mk builds the package list by GREPPING Makefiles for `call BuildPackage`;
      # luci.mk calls it, but the grep cannot see that, so this literal is what puts the package
      # into the SDK's list. Removed as boilerplate, the package silently vanishes.
      - name: the BuildPackage marker
        run: grep -qF 'call BuildPackage' luci-app-footstrap-files/Makefile

      # tools/stage.sh greps for the literal package name rather than $(PKG_NAME), and refuses to
      # build a package whose install-time half it cannot find. It caught this once already.
      - name: the postinst block is named literally
        run: grep -qF 'define Package/luci-app-footstrap-files/postinst' luci-app-footstrap-files/Makefile

      # This package DOES ship an ACL, and exactly one: it is a file manager, the grant is the whole
      # point, and a second file would be a second answer to the same question.
      - name: exactly one acl.d file, and it is ours
        run: |
          set -eu
          n=$(find luci-app-footstrap-files -path '*rpcd/acl.d*' -name '*.json' | wc -l)
          [ "$n" = 1 ] || { echo "expected exactly one acl.d file, found $n" >&2; exit 1; }
          python3 - <<'PY'
          import json, sys
          f = 'luci-app-footstrap-files/root/usr/share/rpcd/acl.d/luci-app-footstrap-files.json'
          d = json.load(open(f))
          g = d.get('luci-app-footstrap-files')
          if not g: sys.exit('the ACL group must be named after the package')
          w = g.get('write', {})
          if not w.get('file'): sys.exit('the file grant is missing')
          if not w.get('cgi-io'): sys.exit('the cgi-io grant is missing - upload and download go through it')
          print('acl ok')
          PY

      # The menu node must depend on that group, or the page appears for a session that cannot use
      # it and every call answers "access denied".
      - name: the menu node depends on the ACL group
        run: |
          python3 - <<'PY'
          import json, sys
          f = 'luci-app-footstrap-files/root/usr/share/luci/menu.d/luci-app-footstrap-files.json'
          for path, node in json.load(open(f)).items():
              acl = node.get('depends', {}).get('acl', [])
              if 'luci-app-footstrap-files' not in acl:
                  sys.exit(path + ' does not depend on the ACL group')
          print('menu ok')
          PY

  lint:
    name: eslint, stylelint and the stylesheet contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The same two linters the theme runs, with the same rules — the two packages are read by the
      # same person and one is a plugin for the other. `wrap-regex` is the load-bearing one here:
      # the SDK path minifies this JS with jsmin, whose regex-vs-division test is a one-character
      # lookback that gets `return /re/` wrong and eats the rest of the file while exiting 0.
      - run: npm run lint:js
      - run: npm run lint:css
      # Colour from the 26 export names and nothing else, no orphaned `.fsf-*`, and no stylesheet
      # that fetches from the network.
      - run: npm run css-contract

  payload:
    name: the staged payload is minified
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        # tools/stage.sh falls back to `git describe` for the version, and a shallow clone has no
        # tags to describe from.
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The whole of what owfeed packages, built here so a release is not the first place it runs.
      - run: tools/stage.sh

      # THE GATE THIS JOB EXISTS FOR. The staging step used to glob a path copied from the sibling
      # package, match nothing, and skip minification in silence — v0.1.0 shipped 65,776 bytes of
      # commented source. Sizes, not a "did it run" flag: a minifier can also be handed the file and
      # write it back unchanged.
      - name: the shipped bytes are smaller than the sources
        run: |
          set -eu
          view=dist/root/www/luci-static/resources/view/footstrap-files
          src=luci-app-footstrap-files/htdocs/luci-static/resources/view/footstrap-files
          for f in browser.js editor.js grammars.js files.css editor.css; do
            a=$(wc -c < "$src/$f"); b=$(wc -c < "$view/$f")
            [ "$b" -lt "$a" ] || { echo "$f: staged $b bytes against $a in the source - not minified" >&2; exit 1; }
            printf '%s: %s -> %s\n' "$f" "$a" "$b"
          done
          # The vendored CSS ships verbatim — it comes minified out of the library's own build. Its
          # two colour themes are gone: editor.css replaces both, off the theme's export tier.
          cmp "$src/vendor/pce/layout.css" "$view/vendor/pce/layout.css"
          cmp "$src/vendor/pce/search.css" "$view/vendor/pce/search.css"
          test ! -d "$view/vendor/pce/themes"
          test -f "$view/vendor/pce/LICENSE"
          echo "vendored CSS byte-identical, licence present"

      # The vendored JS is minified too, and the only thing that can go wrong is invisible from
      # here: those 25 modules import each other BY NAME, so a mangled export would leave a module
      # importing something nobody exports and nothing would say so until a reader opened a file on
      # a router. Every import and export list is compared against the source's.
      - name: the vendored editor kept its module seam
        run: |
          set -eu
          node - <<'JS'
          const { readdirSync, statSync, readFileSync } = require('fs');
          const { join, relative } = require('path');
          const acorn = require('acorn');
          const S = 'luci-app-footstrap-files/htdocs/luci-static/resources/view/footstrap-files/vendor/pce';
          const D = 'dist/root/www/luci-static/resources/view/footstrap-files/vendor/pce';
          const files = [];
          const walk = (p) => statSync(p).isDirectory() ? readdirSync(p).forEach((f) => walk(join(p, f))) : p.endsWith('.js') && files.push(p);
          walk(S);
          const seam = (src) => acorn.parse(src, { ecmaVersion: 2022, sourceType: 'module' }).body.flatMap((n) =>
            n.type === 'ImportDeclaration' ? [ 'i ' + n.source.value + ' ' + n.specifiers.map((s) => s.imported ? s.imported.name : '*').sort() ] :
            n.type === 'ExportNamedDeclaration' ? [ 'e ' + (n.source ? n.source.value + ' ' : '') + n.specifiers.map((s) => s.exported.name).sort() ] : []).sort().join('|');
          let smaller = 0;
          for (const f of files) {
            const rel = relative(S, f), out = join(D, rel);
            const a = readFileSync(f, 'utf8'), b = readFileSync(out, 'utf8');
            if (seam(a) !== seam(b)) { console.error(rel + ': the module seam moved'); process.exit(1); }
            if (b.length >= a.length) { console.error(rel + ': not minified (' + b.length + ' >= ' + a.length + ')'); process.exit(1); }
            smaller += a.length - b.length;
          }
          console.log(files.length + ' vendored modules, seams intact, ' + smaller + ' bytes saved');
          JS

      # The app package's own tree carries no catalogue, and every language has the pair owfeed
      # packages into `luci-i18n-footstrap-files-<lang>`. Read off what was actually staged, which
      # is the tree the packages are cut from.
      - name: the catalogues are staged apart from the app
        run: |
          set -eu
          if find dist/root \( -name '*.lmo' -o -name '*.po' \) | grep -q .; then
            echo "a catalogue was staged into the app package" >&2; exit 1
          fi
          for d in luci-app-footstrap-files/po/*/; do
            lang=$(basename "$d")
            [ "$lang" = templates ] && continue
            test -d "dist/i18n-$lang" || { echo "dist/i18n-$lang was not staged" >&2; exit 1; }
            test -f "dist/po-$lang/$lang/footstrap-files.po" || { echo "dist/po-$lang is missing the catalogue" >&2; exit 1; }
            echo "$lang: staged as its own package"
          done

      # A LuCI resource file is evaluated inside a function wrapper, so this is the parse the router
      # does. minify-js.mjs checks its own output too; this checks what actually lands in the tree.
      - name: the staged modules still parse
        run: |
          set -eu
          for f in dist/root/www/luci-static/resources/view/footstrap-files/*.js; do
            node -e "new Function(require('fs').readFileSync('$f','utf8'))"
            echo "$(basename "$f") parses"
          done

  markup:
    name: file names are data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # This page renders names taken off a filesystem. E() sets text; innerHTML would make a file
      # called `<img onerror=…>` executable markup, and the whole XSS story of this package is that
      # there is no such sink.
      #
      # `--exclude-dir=vendor` and not a path list: the editor lives under the view's own directory
      # now (where a LuCI app keeps what belongs to one view), so a plain recursive grep would read
      # third-party code we ship verbatim and fail on somebody else's markup.
      # THE GREP BELOW IS NOT ENOUGH, and that is worth stating where it lives: luci-base's own
      # `E()` assigns a bare string child to `innerHTML`, so the sink is in a file this grep never
      # reads. Every module that builds DOM shadows `E` with a wrapper that wraps a primitive in an
      # array; this checks that the wrapper is there and that nobody reaches around it.
      - name: the markup sink stays closed
        run: |
          set -eu
          npm ci --ignore-scripts
          node tools/dom-sinks.mjs

      - name: no innerHTML, no insertAdjacentHTML, no document.write
        run: |
          set -eu
          # COMMENTS ARE NOT CODE. The wrapper in each module quotes luci-base's own
          # `node.innerHTML = …` to explain what it exists to close; a grep that cannot tell the
          # difference fails on the fix for the bug it is looking for.
          if grep -rnE --exclude-dir=vendor 'innerHTML|insertAdjacentHTML|document\.write' \
               luci-app-footstrap-files/htdocs/luci-static/resources \
               | grep -vE ':[0-9]+:[[:space:]]*(\*|//|/\*)'; then
            echo "A name from the filesystem must never reach a markup sink." >&2
            exit 1
          fi
          echo "none found in code"

      # The vendored tree keeps its licence beside it, or this package redistributes MIT code with
      # nothing saying so.
      - name: the vendored editor keeps its licence
        run: test -f luci-app-footstrap-files/htdocs/luci-static/resources/view/footstrap-files/vendor/pce/LICENSE
